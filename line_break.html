
<!DOCTYPE html>
<html>
    <head>
        <title>
            js line break
        </title>
    </head>
    <body>

        <h2>JavaScript Strings</h2>

        <p>
            You can break a code line within a text string with a backslash.
        </p>

        <p id="demo"></p>

        <script>
            document.getElementById("demo").innerHTML = "Mashup \
            Stack!";
        </script>

        <!-- using sting additon -->
         <h2>JavaScript Strings</h2>

        <p>The safest way to break a code line in a string is using string addition.</p>

        <p id="demo"></p>

        <script>
            document.getElementById("demo").innerHTML = "Mashup " +
            "Stack!";
        </script>
    </body>
</html>
