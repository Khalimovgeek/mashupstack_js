<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>js strings</title>
</head>
<body>
    <script>
        // template literal
        var x = `This is a new template literal`;
        console.log(x);

        // multi line
        console.log(`This is the first line
        This is the second line`);
        //expressions
        var a = 5;
        var b = 10;
        console.log('The sum of ' + a + ' and' + b + ' is ' + (a + b));

        // after ${}
        console.log(`The sum of ${a} and ${b} is ${a+b}`);

    </script>

    <!-- method to add special character/symbol like ' " ' -->
    <h2>JavaScript Strings</h2>

    <p>The escape sequence \" inserts a double quote in a string.</p>

    <p id="demo"></p>

    <script>
    var x = "Now you are studying in \"Mashup stack\" site.";
    document.getElementById("demo").innerHTML = x; 
    </script>

</body>
</html>
