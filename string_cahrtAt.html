<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="font-family: sans-serif;">
    <h2>JavaScript String Methods</h2>

    <p>The charCodeAt() method returns the unicode of the character at a specified index in a string.</p>

    <p id="demo"></p>
    <p id="demo1"></p>
    <p id="demo2"></p>

    <script>
        var str = "Mashupstack";
        document.getElementById("demo").innerHTML = str.charCodeAt(0);
        var str = "Mashupstack";
        document.getElementById("demo1").innerHTML = str[0];
        str[0] = "A";  // Does not work
        document.getElementById("demo1").innerHTML = str[0];
        var str = "Welcome to Mashup Stack!";
        var output = str.split(" ");
        document.getElementById("demo2").innerHTML = output;

    </script>
</body>
</html>
