<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>slice</title>
</head>
<body>
    <h2>JavaScript String Methods</h2>

    <p>The slice() method extract a part of a string
    and returns the extracted parts in a new string:</p>

    <p id="demo"></p>
    <p id="demo1"></p>
    <p id="demo2"></p>
    <p id="demo3"></p>

    <script>
        var shoes = "Adidas, nike, puma";

        // positive slicing
        var final = shoes.slice(8,12);
        document.getElementById("demo").innerHTML = final; 

        // negative slicing
        var final = shoes.slice(-10,-6);
        document.getElementById("demo1").innerHTML = final;  

        // one parameter
        var final = shoes.slice(8);
        document.getElementById("demo2").innerHTML = final;

        // negative slicing one parameter        
        var final = shoes.slice(-11);
        document.getElementById("demo3").innerHTML = final; 
    </script>


</body>
</html>
